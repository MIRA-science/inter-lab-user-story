name: Deploy mockups to GitHub Pages

# Publishes artifacts/mockups/ as the site root, so the mockups index is the
# landing page and each screen is reachable at a short URL, e.g.
#   https://mira-science.github.io/inter-lab-user-story/06-share-to-dashboard.html
# Addressability is the deliverable (AGENTS.md R6).

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/mockups/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload mockups as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/mockups
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
